services:
  postgres:
    image: postgres:16
    container_name: cloudresource-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  backend:
    build: .
    container_name: cloudresource-backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-dev-secret-key-minimum-32-chars!!
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudresource
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
