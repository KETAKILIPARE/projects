server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/workflow
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-minimum-32-chars!!}
  expiration-ms: 86400000
